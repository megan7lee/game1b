<body>
  <header class="topbar">

  </header>
  <main class="shell" id="game"></main>
  <footer><span aria-hidden="true">✦</span> 金幣小鎮 <span class="footer-dot">·</span> 我的理財冒險</footer>
  <noscript>請啟用 JavaScript，才能遊玩金幣小鎮。</noscript>
  <script>
const pre = [
  { topic: "需要與想要", question: "今天小狗的飼料已經吃完了。哪一樣應該先買？", options: ["會發光的球", "今天要吃的飼料", "拍照用的蝴蝶結"], answer: 1, why: "小狗每天都要吃飯，所以先買飼料。有多的預算，再考慮玩具或裝飾。" },
  { topic: "預算", question: "你有 50 枚金幣，要先留 10 枚做應急金。最多可以花幾枚？", options: ["40 枚", "50 枚", "60 枚"], answer: 0, why: "50 − 10 = 40。先留出應急金，再算能花多少。" },
  { topic: "利潤", question: "做一個書籤花了 6 枚金幣，賣出收到 10 枚。賺了幾枚？", options: ["6 枚", "16 枚", "4 枚"], answer: 2, why: "利潤 = 收入 − 成本，所以 10 − 6 = 4 枚。" },
  { topic: "投資風險", question: "陌生訊息說「把金幣交給我，明天保證翻倍！」你該怎麼做？", options: ["先給一半試試看", "先停下來，找可信任的大人一起查證", "趕快給，免得錯過"], answer: 1, why: "保證高獲利又催你交錢是警訊。先別給錢，找可信任的大人一起查證。" }
];

const post = [
  { topic: "需要與想要", question: "水壺壞了，明天上學要帶水。哪一樣應該先買？", options: ["鑰匙圈", "卡通貼紙", "能裝水的水壺"], answer: 2, why: "上學要喝水，能裝水的水壺是眼前的需要。貼紙和鑰匙圈可以晚點再買。" },
  { topic: "預算", question: "你有 60 枚金幣，要先留 15 枚做應急金。最多可以花幾枚？", options: ["60 枚", "45 枚", "75 枚"], answer: 1, why: "60 − 15 = 45。先保留應急金，剩下的才是現在能花的預算。" },
  { topic: "利潤", question: "做一張卡片花了 7 枚金幣，賣出收到 12 枚。賺了幾枚？", options: ["5 枚", "7 枚", "19 枚"], answer: 0, why: "利潤 = 收入 − 成本，所以 12 − 7 = 5 枚。" },
  { topic: "投資風險", question: "陌生廣告說「今天交金幣，下週保證賺三倍！」你該怎麼做？", options: ["先轉傳給朋友一起買", "只給一點金幣就安全", "先不交錢，找可信任的大人一起查證"], answer: 2, why: "投資可能會虧錢。看到保證高獲利的陌生廣告，先停下來找大人查證。" }
];

const stages = [
  { key: "pre", name: "前測" },
  { key: "pet", name: "寵物照顧", icon: "🐶", color: "peach", description: "先照顧需要，再替想要留預算。" },
  { key: "detective", name: "金幣偵探", icon: "🔎", color: "blue", description: "找線索，認出可疑投資。" },
  { key: "shop", name: "夢想小店", icon: "🏪", color: "yellow", description: "試著進貨、賣東西，再算一算利潤。" },
  { key: "post", name: "後測" },
  { key: "results", name: "學習結果" }
];

const petOptions = [
  { label: "飼料", options: [
    ["基本飼料", 25, "基本飼料已經夠小狗吃一週。"],
    ["豪華飼料", 60, "豪華飼料也能餵飽小狗，但會花掉更多預算。"]
  ] },
  { label: "玩具", options: [
    ["先不買", 0, "小狗也能玩家裡現有的玩具，金幣可以先留著。"],
    ["小皮球", 15, "小皮球是想要。先確認飼料和應急金夠不夠。"],
    ["玩具組", 30, "玩具組比較貴。想一想，買完還能應付臨時支出嗎？"]
  ] },
  { label: "應急金", options: [
    ["不預留", 0, "遇到臨時支出時，就得從其他預算找金幣。"],
    ["留 10 枚", 10, "你留了一些金幣。遇到大一點的支出時，可能還要補一些。"],
    ["留 20 枚", 20, "你先替意外留了 20 枚，沒用完的金幣還是你的。"]
  ] }
];

const rainCost = 12;
const unitCost = 8;
const unitPrice = 13;
const rainCustomers = 6;
const game = document.querySelector("#game");
const balance = document.querySelector("#balance");
const newPet = () => [null, null, null];
let state;

function reset() {
  state = { page: "home", coins: 100, pre: [], post: [], question: 0, pet: newPet(), rain: false, checkpoint: 0,
    clues: new Set(), secret: false, deal: null, stock: null, sale: false, mathStep: 0, math: [] };
}

function button(label, action, styles = "primary", value = "", attributes = "") {
  return `<button type="button" class="${styles}" data-action="${action}" data-value="${value}" ${attributes}>${label}</button>`;
}

function notice(message, style = "") {
  return `<p class="notice ${style}" role="status">${message}</p>`;
}

function screen(page, label, body) {
  const step = stages.find(stage => stage.key === page);
  return `<div class="play">
    <ol class="steps" aria-label="遊戲進度">${stages.map(stage =>
      `<li ${stage === step ? 'class="active" aria-current="step"' : ""}>${stage.name}</li>`).join("")}</ol>
    <section class="panel"><span class="eyebrow">${label}</span>
    <h1 id="screen-title" tabindex="-1">${step.name}</h1>${body}</section></div>`;
}

function syncCoins() {
  balance.textContent = state.coins;
}

function show(focus = true) {
  syncCoins();
  const pages = { home, pre: quiz, pet, detective, shop, post: quiz, results };
  game.innerHTML = pages[state.page]();
  if (focus) {
    document.querySelector("#screen-title").focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }
}

function go(page) {
  state.page = page;
  show();
}

function home() {
  return `<section class="hero">
    <div class="hero-copy">
      <span class="eyebrow">✦ 我的理財冒險</span>
      <h1 id="screen-title" tabindex="-1">金幣小鎮</h1>
      <h2>帶著 100 枚金幣出發！</h2>
      <p>餵飽小狗、拆穿可疑廣告、經營自己的小店。遇到選擇時，你會怎麼花手上的金幣？</p>
      ${button("開始冒險　→", "start")}
    </div>
    <div class="hero-art has-art" role="img" aria-label="小鎮裡有寵物屋、偵探所和夢想小店">
      <span class="hero-fallback" aria-hidden="true">🏡 🔎 🏪</span>
    </div>
  </section>
  <section class="route" aria-labelledby="route-title">
    <h2 id="route-title">小鎮地圖</h2>
    <div class="route-list">${stages.slice(1, 4).map(stage => `<article class="route-card">
      <span class="stamp ${stage.color}" aria-hidden="true">${stage.icon}</span>
      <div><h3>${stage.name}</h3><p>${stage.description}</p></div></article>`).join("")}</div>
  </section>`;
}

function quiz() {
  const before = state.page === "pre";
  const question = (before ? pre : post)[state.question];
  const picked = state[state.page][state.question];
  const answered = picked !== undefined;
  return screen(state.page, `${before ? "出發前" : "冒險後"} · 第 ${state.question + 1}／4 題`,
    `<h2>${question.question}</h2>
    <div class="answers" aria-label="作答選項">${question.options.map((option, index) => {
      let style = "choice";
      let tag = "";
      if (answered && index === question.answer) { style += " correct"; tag = " ✓ 正確答案"; }
      if (answered && index === picked && index !== question.answer) { style += " wrong"; tag = " · 你的答案"; }
      return button(option + tag, "answer", style, index, answered ? "disabled" : "");
    }).join("")}</div>
    ${answered ? notice(`${picked === question.answer ? "答對了！" : "再想想。"}${question.why}`) : ""}
    <div class="actions">${button(state.question < 3 ? "下一題　→" : before ? "前往寵物屋　→" : "查看學習結果　→", "quiz-next", "primary", "", answered ? "" : "disabled")}</div>`);
}

function petBudget() {
  const amounts = state.pet.map((pick, index) => pick === null ? 0 : petOptions[index].options[pick][1]);
  const [food, toy, savings] = amounts;
  return { spending: food + toy, savings, total: food + toy + savings };
}

function petTotals() {
  const budget = petBudget();
  return `<div class="total"><span>飼料與玩具</span><strong>${budget.spending} 枚</strong></div>
    <div class="total"><span>先留應急金</span><strong>${budget.savings} 枚</strong></div>
    <div class="total"><span>分配後可用</span><strong>${state.coins - budget.total} 枚</strong></div>`;
}

function pet() {
  if (state.rain) {
    const paid = Math.min(petBudget().savings, rainCost);
    const payment = paid === rainCost ? "這筆錢全由應急金支付。" :
      paid === 0 ? "你從手上的金幣支付這筆費用。" : `應急金付了 ${paid} 枚，其餘 ${rainCost - paid} 枚從手上補足。`;
    return screen("pet", "🐶 第 1 關",
      `${notice("🌧️ 小鎮下雨了！雨水泡濕了小狗的墊子，換乾墊子要花 12 枚金幣。每位玩家都會遇到同一場雨。", "rain")}
      ${notice(`${payment}沒用完的應急金仍在錢包裡。你現在有 ${state.coins} 枚金幣。`)}
      <div class="actions">${button("前往偵探所　→", "detective-start")}</div>`);
  }
  return screen("pet", "🐶 第 1 關",
    `<p class="intro">小狗需要一週的飼料。替牠選飼料、決定要不要買玩具，再想想要留多少應急金。</p>
    ${petOptions.map((group, index) => `<fieldset><legend>${group.label}</legend>
      <div class="pill-row">${group.options.map(([name, amount], option) => button(
        index === 2 ? name : `${name} · ${amount} 枚`, "pet-pick", "choice", `${index}-${option}`,
        `aria-pressed="${state.pet[index] === option}"`)).join("")}</div>
      <p class="hint" id="pet-hint-${index}" role="status"></p></fieldset>`).join("")}
    <div class="totals" id="pet-totals">${petTotals()}</div>
    <div id="pet-status"></div>
    <div class="actions">${button("確認分配　→", "pet-confirm", "primary", "", "disabled")}</div>`);
}

function updatePet() {
  document.querySelector("#pet-totals").innerHTML = petTotals();
  document.querySelector('[data-action="pet-confirm"]').disabled = state.pet.includes(null);
  document.querySelector("#pet-status").innerHTML = "";
}

const offers = [
  { title: "廣告 A｜一夜翻倍", text: "「轉 20 枚金幣給我，明天保證變 40 枚！剩最後一個名額，現在就給錢！」", clue: "對方身分不明，又保證翻倍、催你立刻付錢。這些都是警訊。" },
  { title: "廣告 B｜小鎮菜園", text: "「投入 10 枚金幣種菜。收成好的話可能賺錢，遇到壞天氣也可能賠錢。」", clue: "這份廣告有說明可能虧錢。還是要查誰在經營、錢怎麼用，再和大人一起評估。" }
];

const deals = [
  { label: "相信廣告 A，交出 20 枚", loss: 20, feedback: "陌生人拿到金幣就消失了，你少了 20 枚。下次看到「保證翻倍」又被催著付錢，先停下來查證。" },
  { label: "和大人查證後，投入菜園 10 枚", loss: 4, feedback: "這次菜園收成少，只退回 6 枚，你虧了 4 枚。即使查過資料，投資還是可能賠錢。" },
  { label: "先留下金幣，和大人查證", loss: 0, feedback: "你保住了金幣，也有時間核對來源。對方越催你，越值得先停下來查一查。" }
];

function detective() {
  if (state.deal !== null) {
    return screen("detective", "🔎 第 2 關",
      `${notice(deals[state.deal].feedback, state.deal === 2 ? "" : "warn")}
      <div class="actions">${button("前往夢想小店　→", "shop-start")}</div>`);
  }
  return screen("detective", "🔎 第 2 關",
    `<p class="intro">小鎮佈告欄上有兩張廣告。點開兩張廣告找線索，再決定要怎麼做。</p>
    ${offers.map((offer, index) => `<details class="offer" data-clue="${index}">
      <summary>${offer.title}</summary><p>${offer.text}</p>${notice(offer.clue)}</details>`).join("")}
    <p class="hint" id="clue-progress" role="status">已查看 ${state.clues.size}／2 則線索</p>
    <details class="secret">
      <summary>✦ 檢查佈告欄背面</summary>
      <h2>秘密任務</h2>
      <p>哪一句話是可疑投資的警訊？找對可獲得 8 枚金幣。</p>
      <div class="pill-row">
        ${button("保證翻倍，現在就付錢", "secret", "choice", "yes")}
        ${button("可能賠錢，可以慢慢考慮", "secret", "choice", "no")}
      </div>
      <p class="hint" id="secret-feedback" role="status"></p>
    </details>
    <h2>你的決定</h2><div class="answers">${deals.map((deal, index) => button(deal.label, "deal", "choice", index, "disabled")).join("")}</div>
    <div id="deal-status"></div>`);
}

function saleNumbers() {
  const cost = state.stock * unitCost;
  const sold = Math.min(state.stock, rainCustomers);
  const revenue = sold * unitPrice;
  return { cost, sold, revenue, profit: revenue - cost };
}

function signed(amount) {
  return amount > 0 ? `+${amount}` : String(amount).replace("-", "−");
}

function shop() {
  if (state.sale) {
    const { cost, sold, revenue, profit } = saleNumbers();
    const exercises = [
      { prompt: "進貨一共花了幾枚金幣？", guesses: [cost + unitCost, cost, cost - unitCost], correct: 1,
        explanation: `成本 = 進貨數量 × 每份成本。${state.stock} × ${unitCost} = ${cost} 枚。` },
      { prompt: "賣出書籤一共收到幾枚金幣？", guesses: [revenue, revenue + unitPrice, revenue - unitPrice], correct: 0,
        explanation: `收入 = 賣出數量 × 每份售價。${sold} × ${unitPrice} = ${revenue} 枚。` },
      { prompt: "用收入減成本，今天的利潤是多少？", guesses: [revenue, profit - 5, profit], correct: 2,
        explanation: `利潤 = 收入 − 成本。${revenue} − ${cost} = ${String(profit).replace("-", "−")} 枚。${profit < 0 ? "沒賣掉的書籤也花了進貨錢，所以今天虧錢。" : ""}` }
    ];
    const exercise = exercises[state.mathStep];
    const picked = state.math[state.mathStep];
    const answered = picked !== undefined;
    return screen("shop", "🏪 第 3 關",
      `<p class="intro">你進了 ${state.stock} 份書籤（每份 ${unitCost} 枚），賣出 ${sold} 份（每份 ${unitPrice} 枚），還有 ${state.stock - sold} 份沒賣掉。</p>
      <div class="totals">
        <div class="total"><span>成本</span><strong>${state.mathStep > 0 || answered ? cost + " 枚" : "？"}</strong></div>
        <div class="total"><span>收入</span><strong>${state.mathStep > 1 || (state.mathStep === 1 && answered) ? revenue + " 枚" : "？"}</strong></div>
        <div class="total"><span>利潤</span><strong>${state.mathStep === 2 && answered ? signed(profit) + " 枚" : "？"}</strong></div>
      </div>
      <h2>${exercise.prompt}</h2>
      ${state.mathStep === 2 ? '<p class="hint">負數代表今天虧錢，正數代表今天賺錢。</p>' : ''}
      <div class="pill-row" style="margin-top:8px">${exercise.guesses.map((guess, index) => {
        const style = answered && index === exercise.correct ? "choice correct" : answered && picked === index ? "choice wrong" : "choice";
        return button(`${String(guess).replace("-", "−")} 枚`, "math", style, index, answered ? "disabled" : "");
      }).join("")}</div>
      ${answered ? notice((picked === exercise.correct ? "算對了！" : "一起看看算式。") + exercise.explanation) : ""}
      <div class="actions">${button(state.mathStep === 2 ? "開始後測　→" : "下一筆　→", "math-next", "primary", "", answered ? "" : "disabled")}</div>`);
  }
  return screen("shop", "🏪 第 3 關",
    `<p class="intro">你要賣手工書籤。進貨每份 ${unitCost} 枚，賣出每份能收到 ${unitPrice} 枚。</p>
    ${notice(`🌧️ 那場雨也影響了市集。今天只有 ${rainCustomers} 位客人，每人最多買 1 份書籤。`, "rain")}
    ${state.coins < unitCost ? `${notice("錢包裡的金幣買不起 1 份。你可以回到偵探關，用當時的金幣重新選擇。", "warn")}
      <div class="actions">${button("重新挑戰金幣偵探　↻", "detective-retry")}</div>` :
    `<fieldset><legend>你要進貨幾份？</legend>
      <div class="pill-row">${[1, 3, 6, 10].map(amount => button(`${amount} 份`, "stock", "choice", amount, 'aria-pressed="false"')).join("")}</div>
      <p class="hint" id="stock-hint" role="status"></p></fieldset>
      <div id="shop-status"></div>
      <div class="actions">${button("確認進貨並開店　→", "sell", "primary", "", "disabled")}</div>`}`);
}

function score(questions, answers) {
  return questions.reduce((total, question, index) => total + Number(question.answer === answers[index]), 0);
}

function review(questions, answers, title) {
  const mistakes = questions.map((question, index) => ({ question, index })).filter(({ question, index }) => answers[index] !== question.answer);
  return `<h2>${title}錯題解析</h2>${mistakes.length ? mistakes.map(({ question, index }) =>
    `<article class="review"><p><strong>第 ${index + 1} 題 · ${question.topic}</strong></p>
    <p>${question.question}</p><p>你的答案：${question.options[answers[index]]}</p>
    <p>正確答案：${question.options[question.answer]}</p><p>${question.why}</p></article>`).join("") : "<p>四題都答對了！</p>"}`;
}

function results() {
  const before = score(pre, state.pre);
  const after = score(post, state.post);
  return screen("results", "🏁 冒險完成",
    `<p class="intro">每題 1 分。上方錢包顯示遊戲金幣，這裡顯示測驗分數。</p>
    <div class="totals">
      <div class="total"><span>前測</span><strong>${before}／4</strong></div>
      <div class="total"><span>後測</span><strong>${after}／4</strong></div>
      <div class="total"><span>進步分數</span><strong>${signed(after - before)} 分</strong></div>
    </div>
    ${review(pre, state.pre, "前測")}${review(post, state.post, "後測")}
    <form id="reflection">
      <h2><label for="reflection-text">下次你會改變哪個決定？為什麼？</label></h2>
      <textarea id="reflection-text" required maxlength="600" placeholder="我下次會……，因為……"></textarea>
      <div id="reflection-result"></div>
      <div class="actions"><button class="primary" type="submit">完成反思</button>${button("再玩一次　↻", "restart", "secondary")}</div>
    </form>`);
}

const actions = {
  start() { go("pre"); },
  answer(value) {
    const answers = state[state.page];
    if (answers[state.question] !== undefined) return;
    answers[state.question] = Number(value);
    show(false);
    document.querySelector('[data-action="quiz-next"]').focus({ preventScroll: true });
  },
  "quiz-next"() {
    if (state[state.page][state.question] === undefined) return;
    if (state.question < 3) { state.question += 1; show(); return; }
    go(state.page === "pre" ? "pet" : "results");
  },
  "pet-pick"(value, target) {
    const [group, option] = value.split("-").map(Number);
    state.pet[group] = option;
    target.closest("fieldset").querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed", String(button === target)));
    document.querySelector(`#pet-hint-${group}`).textContent = petOptions[group].options[option][2];
    updatePet();
  },
  "pet-confirm"() {
    if (state.pet.includes(null) || state.rain) return;
    const budget = petBudget();
    const needed = budget.spending + Math.max(budget.savings, rainCost);
    if (needed > state.coins) {
      document.querySelector("#pet-status").innerHTML =
        notice(`金幣不足，這個分配需要 ${needed} 枚。可以減少玩具、換基本飼料，或重新分配。`, "warn") +
        `<div class="actions">${button("重新分配　↻", "pet-retry", "secondary")}</div>`;
      return;
    }
    state.coins -= budget.spending + rainCost;
    state.rain = true;
    show();
  },
  "pet-retry"() { state.pet = newPet(); show(); },
  "detective-start"() { state.checkpoint = state.coins; go("detective"); },
  secret(value) {
    if (state.secret) return;
    if (value === "yes") {
      state.secret = true;
      state.coins += 8;
      document.querySelectorAll('[data-action="secret"]').forEach(button => { button.disabled = true; });
      syncCoins();
    }
    document.querySelector("#secret-feedback").textContent = state.secret ?
      "找到警訊了！秘密任務獎勵 8 枚金幣。" : "說明可能虧錢是在提醒風險。再找找哪句話有保證獲利、催你付錢。";
  },
  deal(value) {
    if (state.clues.size !== 2 || state.deal !== null) return;
    const deal = deals[Number(value)];
    if (state.coins < deal.loss) {
      document.querySelector("#deal-status").innerHTML = notice("金幣不足，試著改選其他做法。", "warn");
      return;
    }
    state.deal = Number(value);
    state.coins -= deal.loss;
    show();
  },
  "shop-start"() { go("shop"); },
  "detective-retry"() {
    state.coins = state.checkpoint;
    state.clues.clear();
    state.deal = null;
    state.secret = false;
    state.stock = null;
    go("detective");
  },
  stock(value, target) {
    state.stock = Number(value);
    const { cost, sold } = saleNumbers();
    target.closest("fieldset").querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed", String(button === target)));
    document.querySelector("#stock-hint").textContent = `進貨要 ${cost} 枚。今天最多能賣出 ${sold} 份。`;
    document.querySelector("#shop-status").innerHTML = "";
    document.querySelector('[data-action="sell"]').disabled = false;
  },
  sell() {
    if (state.stock === null || state.sale) return;
    const { cost, profit } = saleNumbers();
    if (cost > state.coins) {
      document.querySelector("#shop-status").innerHTML =
        notice(`金幣不足！還差 ${cost - state.coins} 枚。請改選較少的進貨數量。`, "warn") +
        `<div class="actions">${button("重新選擇進貨量　↻", "shop-retry", "secondary")}</div>`;
      return;
    }
    state.coins += profit;
    state.sale = true;
    show();
  },
  "shop-retry"() { state.stock = null; show(); },
  math(value) {
    if (state.math[state.mathStep] !== undefined) return;
    state.math[state.mathStep] = Number(value);
    show(false);
    document.querySelector('[data-action="math-next"]').focus({ preventScroll: true });
  },
  "math-next"() {
    if (state.math[state.mathStep] === undefined) return;
    if (state.mathStep < 2) { state.mathStep += 1; show(); return; }
    state.question = 0;
    go("post");
  },
  restart() { reset(); go("home"); }
};

game.addEventListener("click", event => {
  const target = event.target.closest("button[data-action]");
  if (target && !target.disabled) actions[target.dataset.action](target.dataset.value, target);
});

game.addEventListener("toggle", event => {
  const clue = event.target.dataset.clue;
  if (event.target.open && clue !== undefined) {
    state.clues.add(clue);
    document.querySelector("#clue-progress").textContent = `已查看 ${state.clues.size}／2 則線索`;
    if (state.clues.size === 2) document.querySelectorAll('[data-action="deal"]').forEach(button => { button.disabled = false; });
  }
}, true);

game.addEventListener("submit", event => {
  if (event.target.id !== "reflection") return;
  event.preventDefault();
  const field = document.querySelector("#reflection-text");
  const result = document.querySelector("#reflection-result");
  if (!field.value.trim()) {
    result.innerHTML = notice("請寫下一個決定和你想改變它的原因。", "warn");
    field.focus();
    return;
  }
  result.innerHTML = notice("反思完成！你可以把這個想法和老師或同學分享。");
});

reset();
show(false);
  </script>
</body>
</html>
